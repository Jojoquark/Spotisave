name: Build Spotisave Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: set -o pipefail && ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Build APKs (Debug & Release)
        run: set -o pipefail && ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Locate Generated APK & Verify Signature
        run: |
          echo "### Generated APK Files"
          find app/build/outputs/apk -type f -name "*.apk" || true
          keytool -list -v -keystore app/spotisave.keystore -storepass spotisave123 | grep -E "(Alias|SHA256)" || true

      - name: Report Failure Details
        if: failure()
        run: |
          echo "### Build / Test Failure Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f test.log ]; then
            echo "#### testDebugUnitTest (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "(FAILED|e: |FAILURE:|Caused by:)" test.log | head -n 15 | while IFS= read -r line; do
              echo "::error title=Test Failure::$line"
            done
          fi
          if [ -f build.log ]; then
            echo "#### assembleDebug (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^(e: |FAILURE:|Caused by:)" build.log | head -n 15 | while IFS= read -r line; do
              echo "::error title=Build Failure::$line"
            done
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotisave-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotisave-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: SpotiSave v1.2.0
          body: |
            ### 🚀 SpotiSave v1.2.0
            - **Autoritative Wiedergabeerfassung & Null Kontext-Bleed**: Playlists und Lieblingssongs (Liked Songs) werden strikt getrennt geführt. Kein versehentliches Überschreiben oder Verwechseln von Lesezeichen beim Wechseln zwischen Playlists und Bibliothek.
            - **Adaptiver Hintergrund-Poller**: Intelligente Taktung zwischen 5 Minuten im Leerlauf (akkuschonend) und 4 Sekunden bei aktiver Wiedergabe für sekundengenaue Positionsverfolgung.
            - **Benachrichtigungen als Sofort-Trigger**: Spotify-Media-Notifications wecken SpotiSave in Echtzeit auf und initiieren unverzüglich autoritative Web-API-Abgleiche.
            - **In-App Auto-Update Checker**: Erkennt neue Releases automatisch beim Start oder in den Einstellungen mit direktem 1-Klick-Download.
            - **Apple Liquid Glass Design**: Raffinierte Lichtbrechungen, Meniskus-Effekte und adaptiver Hell-/Dunkelmodus nach Apple HIG.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
