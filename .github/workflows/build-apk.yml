name: Build Spotisave Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Locate Generated APK
        run: |
          echo "### Generated APK Files"
          find app/build/outputs/apk -type f -name "*.apk"

      - name: Report Failure Details
        if: failure()
        run: |
          echo "### Build / Test Failure Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f test.log ]; then
            echo "#### testDebugUnitTest (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^(e: |FAILURE:|Caused by:)" test.log | head -n 15 | while IFS= read -r line; do
              echo "::error title=Test Failure::$line"
            done
          fi
          if [ -f build.log ]; then
            echo "#### assembleDebug (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^(e: |FAILURE:|Caused by:)" build.log | head -n 15 | while IFS= read -r line; do
              echo "::error title=Build Failure::$line"
            done
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotisave-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
